name: Build, Sync & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'content/**'
      - 'public/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Default to least privilege across the workflow
permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # PR Verification Job (Read-Only: Safe for same-repo & fork PRs)
  # ----------------------------------------------------------------------------
  verify-pr:
    name: Verify Site & Resume PDF (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Frontend Quality, Markup & Assets
        run: |
          chmod +x tests/verify_site.py
          python3 tests/verify_site.py

      - name: Verify Google Chrome Availability
        run: |
          which google-chrome || which chromium-browser || which chromium
          google-chrome --version || chromium --version

      - name: Generate & Verify Deterministic PDF
        run: |
          chmod +x tools/generate_pdf.sh tools/verify_pdf.py
          ./tools/generate_pdf.sh --force --verify

      - name: Check if Committed PDF is in Sync
        run: |
          if [ -n "$(git status --porcelain public/assets/documents/resume.pdf)" ]; then
            echo "::warning title=Resume PDF Out of Sync::content/resume.html changes were detected and the generated PDF differs from what is committed. The updated PDF will be automatically built, committed, and deployed when merged to main, or you can run 'make all' locally before pushing."
          else
            echo "✅ Committed PDF matches the latest generated version."
          fi

      - name: Upload PDF Artifact (PR Preview)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: Bhargav_Kukadiya_Senior_iOS_Architect_Resume_PR
          path: public/assets/documents/resume.pdf
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Build & Sync Job (Generates latest PDF, auto-commits diff, packages public/)
  # ----------------------------------------------------------------------------
  build:
    name: Build, Verify & Sync Site
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Frontend Quality, Markup & Assets
        run: |
          chmod +x tests/verify_site.py
          python3 tests/verify_site.py

      - name: Verify Google Chrome Availability
        run: |
          which google-chrome || which chromium-browser || which chromium
          google-chrome --version || chromium --version

      - name: Generate & Verify Deterministic PDF
        run: |
          chmod +x tools/generate_pdf.sh tools/verify_pdf.py
          ./tools/generate_pdf.sh --force --verify

      - name: Upload Standalone PDF Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: Bhargav_Kukadiya_Senior_iOS_Architect_Resume
          path: public/assets/documents/resume.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Auto-commit Updated PDF (Native Git)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/documents/resume.pdf
          if ! git diff --staged --quiet; then
            git commit -m "chore(resume): auto-generate updated resume PDF [skip ci]"
            git push
            echo "✅ Successfully committed and pushed updated PDF to main."
          else
            echo "✅ PDF is already up-to-date in repository. No commit needed."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages Artifact (public/ directory only)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: 'public'

  # ----------------------------------------------------------------------------
  # Deploy Job (Deploys public/ artifact to GitHub Pages in the same run)
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
